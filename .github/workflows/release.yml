# Builds, signs and publishes both editions whenever a version tag is pushed.
#
# Required repository secrets (the same key as earlier releases, so updates install in place):
#   SIGNING_KEYSTORE_BASE64  base64 of the keystore file
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # SHA-256 of the certificate every Island release is signed with. A different key would make
  # updates fail to install over existing copies, so the build refuses to publish one.
  EXPECTED_CERT_SHA256: e7833fb028bcbf4000cc864183acfc2323fa18cbbb73223266d479b32b7fe8ea

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew --no-daemon testFullDebugUnitTest assembleFullRelease assembleLiteRelease

      - name: Verify signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/*/release/*.apk; do
            cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is signed with $cert, expected $EXPECTED_CERT_SHA256"
              exit 1
            fi
          done

      - name: Collect APKs
        run: |
          version="${TAG#v}"
          mkdir dist
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/Island-v$version.apk"
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "dist/Island-Lite-v$version.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "Island ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --title "Island ${TAG#v}" --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
